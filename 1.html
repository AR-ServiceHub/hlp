<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Memory 🌸</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:system-ui;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:white;
background:radial-gradient(circle at top,#2a0f1f,#12060f);
}

body::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 30%, rgba(255,111,169,0.25), transparent 40%),
radial-gradient(circle at 80% 70%, rgba(179,136,255,0.2), transparent 40%);
z-index:-1;
}

.section{
position:absolute;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
width:100%;
max-width:500px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(14px);
padding:30px;
border-radius:20px;
border:1px solid rgba(255,255,255,0.15);
}

input,button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
margin-top:10px;
text-align:center;
}

button{
background:linear-gradient(45deg,#ff6fa9,#b388ff);
color:white;
font-weight:bold;
cursor:pointer;
}

.loader{
width:50px;
height:50px;
border:4px solid rgba(255,255,255,0.2);
border-top:4px solid #ff6fa9;
border-radius:50%;
animation:spin 1s linear infinite;
margin:auto;
}

@keyframes spin{
100%{transform:rotate(360deg);}
}

.title{
font-size:1.8rem;
color:#ffb3d1;
margin-bottom:10px;
}

.message{
white-space:pre-line;
line-height:1.7;
min-height:120px;
opacity:0;
transform:translateY(10px);
transition:1s;
}

.show{
opacity:1;
transform:translateY(0);
}

.hidden{display:none}

</style>
</head>

<body>

<!-- INTRO -->
<div class="section" id="intro">
<div class="card">
<h2>🌸 Birthday Memory System</h2>
<p>Ada sesuatu untuk kamu…</p>
<button onclick="start()">Start 🎀</button>
</div>
</div>

<!-- LOGIN -->
<div class="section hidden" id="login">
<div class="card">
<h2>🔐 Unlock</h2>
<input id="pw" placeholder="ddmmyyyy/hari-bulan-tahun(contoh:12122003)">
<button onclick="unlock()">Enter</button>
<p id="err" style="color:#ff6b6b;"></p>
</div>
</div>

<!-- LOADING -->
<div class="section hidden" id="loading">
<div class="card">
<div class="loader"></div>
<p>Opening memories…</p>
</div>
</div>

<!-- FINAL -->
<div class="section hidden" id="final">
<div class="card">

<h2 class="title" id="title"></h2>
<p class="message" id="msg"></p>

<button onclick="stopMusic()">🔇 Stop Music</button>

</div>
</div>

<script>

/* ================= MULTI USER DATA ================= */
const USERS = {
"07062015":{
name:"Adik",
text:`Selamat ulang tahun marisa🌸

Nggak kerasa umur ica nambah lagi. Semoga di umur yang sekarang, hal-hal yang ica pengen bisa pelan-pelan tercapai.
Semoga sehat selalu, makin dewasa, makin percaya diri, dan jangan lupa nikmatin setiap proses yang lagi dijalanin.

Pokoknya semoga tahun ini jadi tahun yang lebih baik dari tahun sebelumnya. 🎂✨
},

"07062002":{
name:"Kakak",
text:`Selamat ulang tahun aulia🎂

Semoga di umur yang sekarang semuanya berjalan lebih lancar dari sebelumnya. Apa yang lagi diperjuangin semoga dikasih jalan yang baik dan hasil yang terbaik.
Semoga selalu sehat, panjang umur, dan tetap jadi pribadi yang kuat dalam menghadapi apa pun yang datang ke depan.
akhirnya terbayar satu per satu ✨

Semoga tahun ini membawa lebih banyak hal baik buat Mbak. 🎉
}
};

/* ================= FLOW ================= */
let ctx;
let currentAudio = null;

function start(){
document.getElementById("intro").classList.add("hidden");
document.getElementById("login").classList.remove("hidden");
}

function unlock(){

const val=document.getElementById("pw").value;
const err=document.getElementById("err");

const user = USERS[val];

if(!user){
err.innerText="Password salah ❌";
return;
}

err.innerText="";

document.getElementById("login").classList.add("hidden");
document.getElementById("loading").classList.remove("hidden");

setTimeout(()=>{

document.getElementById("loading").classList.add("hidden");
document.getElementById("final").classList.remove("hidden");

document.getElementById("title").innerText=
"🎉 Happy Birthday " + user.name;

const msg = document.getElementById("msg");
msg.innerText = user.text;

setTimeout(()=>msg.classList.add("show"),300);

playMelody();
confetti();

},2000);

}

/* ================= MUSIC (FIXED + STOP SAFE) ================= */
function playMelody(){

stopMusic(); // penting: cegah double audio

ctx = new (window.AudioContext || window.webkitAudioContext)();

const notes = [
523.25, 523.25, 587.33, 523.25,
698.46, 659.25,
523.25, 523.25, 587.33, 523.25,
783.99, 698.46
];

let i = 0;

const gain = ctx.createGain();
gain.gain.value = 0.05;
gain.connect(ctx.destination);

function play(){

if(!ctx) return;

const osc = ctx.createOscillator();
osc.type = "sine";
osc.frequency.value = notes[i];

osc.connect(gain);
osc.start();

setTimeout(()=>{
osc.stop();
osc.disconnect();
},400);

i = (i + 1) % notes.length;

setTimeout(play,450);
}

play();

}

/* ================= STOP MUSIC (FIX TOTAL) ================= */
function stopMusic(){

if(ctx){
try{
ctx.close();
}catch(e){}
ctx = null;
}

}

/* ================= CONFETTI ================= */
function confetti(){

for(let i=0;i<120;i++){

const c=document.createElement("div");
c.style.position="fixed";
c.style.left=Math.random()*100+"vw";
c.style.top="-10px";
c.style.width="6px";
c.style.height="6px";
c.style.background=`hsl(${Math.random()*360},100%,70%)`;
c.style.borderRadius="50%";
c.style.zIndex="999";

document.body.appendChild(c);

const dur=Math.random()*3000+2000;

c.animate([
{transform:"translateY(0)"},
{transform:`translateY(110vh) translateX(${Math.random()*200-100}px)`}
],{duration:dur,easing:"linear"});

setTimeout(()=>c.remove(),dur);

}

}

</script>

</body>
</html>
