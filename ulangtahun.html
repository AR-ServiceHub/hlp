<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Memory 🌸</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{
min-height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:#5a4d66;
background:linear-gradient(135deg,#ffeaf4 0%,#fff5fb 40%,#f4eeff 100%);
}
body::before{
content:"";
position:absolute;inset:0;
background:
radial-gradient(circle at 20% 30%,rgba(255,182,193,.45),transparent 40%),
radial-gradient(circle at 80% 20%,rgba(221,160,255,.35),transparent 40%),
radial-gradient(circle at 50% 90%,rgba(255,255,255,.45),transparent 40%);
z-index:-1;
}
.section{position:absolute;width:100%;height:100%;display:flex;justify-content:center;align-items:center;padding:20px}
.card{
width:100%;max-width:520px;max-height:90vh;overflow-y:auto;
background:rgba(255,255,255,.45);
backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
padding:30px;border-radius:28px;
border:1px solid rgba(255,255,255,.55);
box-shadow:0 8px 32px rgba(196,149,255,.18);
}
input{
width:100%;padding:14px;border-radius:14px;
border:1px solid rgba(255,255,255,.5);
background:rgba(255,255,255,.55);
font-size:16px;outline:none;margin-top:12px;
}
button{
width:100%;padding:14px;border:none;border-radius:14px;
margin-top:12px;font-weight:600;font-size:15px;cursor:pointer;
background:linear-gradient(135deg,#ffb7d5,#d8b4fe);
color:white;transition:.3s;
}
button:hover{transform:translateY(-2px)}
.loader{
width:50px;height:50px;margin:auto;
border:4px solid rgba(255,255,255,.3);
border-top:4px solid #ff8fc7;border-radius:50%;
animation:spin 1s linear infinite;
}
@keyframes spin{100%{transform:rotate(360deg)}}
.title{
font-size:2rem;margin-bottom:15px;
background:linear-gradient(90deg,#ff8fc7,#c084fc);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.message{
white-space:pre-line;line-height:1.9;font-size:16px;
color:#5f5870;opacity:0;transform:translateY(10px);transition:1s;
}
.show{opacity:1;transform:translateY(0)}
.hidden{display:none}
@media (max-width:600px){
.card{padding:22px;max-height:88vh}
.title{font-size:1.6rem}
.message{font-size:15px}
}
</style>
</head>
<body>

<div class="section" id="intro">
<div class="card">
<h2>🌸 Birthday Memory System</h2>
<p style="margin-top:10px">Ada sesuatu untuk kamu…</p>
<button onclick="start()">Start 🎀</button>
</div>
</div>

<div class="section hidden" id="login">
<div class="card">
<h2>🔐 Unlock</h2>
<input id="pw" placeholder="ddmmyyyy (contoh: 07062015)">
<button onclick="unlock()">Enter</button>
<p id="err" style="color:#e85d75;margin-top:10px"></p>
</div>
</div>

<div class="section hidden" id="loading">
<div class="card">
<div class="loader"></div>
<p style="margin-top:15px">Opening memories…</p>
</div>
</div>

<div class="section hidden" id="final">
<div class="card">
<h2 class="title" id="title"></h2>
<p class="message" id="msg"></p>
<button onclick="stopMusic()">🔇 Stop Music</button>
</div>
</div>

<script>
const USERS={
"07062015":{
name:"Adik",
text:`Selamat ulang tahun Marisa 🌸

Nggak kerasa umur Ica nambah lagi.

Semoga di umur yang sekarang, hal-hal yang Ica pengen bisa pelan-pelan tercapai.

Semoga sehat selalu, makin dewasa, makin percaya diri, dan jangan lupa nikmatin setiap proses yang lagi dijalanin.

Pokoknya semoga tahun ini jadi tahun yang lebih baik dari tahun sebelumnya. 🎂✨`
},
"07062002":{
name:"Kakak",
text:`Selamat ulang tahun Aulia 🎂

Semoga di umur yang sekarang semuanya berjalan lebih lancar dari sebelumnya.

Apa yang lagi diperjuangin semoga dikasih jalan yang baik dan hasil yang terbaik.

Semoga selalu sehat, panjang umur, dan tetap jadi pribadi yang kuat menghadapi apa pun yang datang ke depan.

Semoga tahun ini membawa lebih banyak hal baik buat Mbak. 🎉`
}
};

let ctx=null;

function start(){
intro.classList.add("hidden");
login.classList.remove("hidden");
}

function unlock(){
const val=document.getElementById("pw").value.trim();
const user=USERS[val];

if(!user){
err.innerText="Password salah ❌";
return;
}

err.innerText="";
login.classList.add("hidden");
loading.classList.remove("hidden");

setTimeout(()=>{
loading.classList.add("hidden");
final.classList.remove("hidden");

title.innerText="🎉 Happy Birthday "+user.name;
msg.innerText=user.text;

setTimeout(()=>msg.classList.add("show"),300);

playMelody();
confetti();
},2000);
}

function playMelody(){
stopMusic();

ctx=new(window.AudioContext||window.webkitAudioContext)();

const notes=[523.25,523.25,587.33,523.25,698.46,659.25,523.25,523.25,587.33,523.25,783.99,698.46];

const gain=ctx.createGain();
gain.gain.value=0.05;
gain.connect(ctx.destination);

let i=0;

function loop(){
if(!ctx)return;

const osc=ctx.createOscillator();
osc.type="sine";
osc.frequency.value=notes[i];

osc.connect(gain);
osc.start();

setTimeout(()=>{
try{osc.stop();osc.disconnect();}catch(e){}
},400);

i=(i+1)%notes.length;
setTimeout(loop,450);
}
loop();
}

function stopMusic(){
if(ctx){
ctx.close();
ctx=null;
}
}

function confetti(){
for(let i=0;i<120;i++){
const c=document.createElement("div");
c.style.position="fixed";
c.style.left=Math.random()*100+"vw";
c.style.top="-10px";
c.style.width="7px";
c.style.height="7px";
c.style.background=`hsl(${Math.random()*360},100%,75%)`;
c.style.borderRadius="50%";
c.style.zIndex="999";

document.body.appendChild(c);

const dur=Math.random()*3000+2000;

c.animate([
{transform:"translateY(0)"},
{transform:`translateY(110vh) translateX(${Math.random()*200-100}px)`}
],{duration:dur,easing:"linear"});

setTimeout(()=>c.remove(),dur);
}
}
</script>
</body>
</html>
